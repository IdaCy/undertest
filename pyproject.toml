[project]
name = "undertest"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["inspect-ai", "openai", "python-dotenv", "jsonschema"]

[project.optional-dependencies]
metadata = ["pyarrow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared", "src/causes", "src/characteristics", "src/signals", "src/emergence"]

[tool.hatch.build.targets.wheel.force-include]
"data/report_task" = "shared/assets/report_task"
"src/studies.json" = "shared/studies.json"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "data", "docs", "README.md", "pyproject.toml", "uv.lock", ".env.example"]
